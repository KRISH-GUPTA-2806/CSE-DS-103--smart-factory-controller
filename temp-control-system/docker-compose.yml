services:
  postgres:
    image: postgres:16
    container_name: tempctl-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tempctl-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Optional: run Python apps in Docker too  ->  docker compose --profile apps up -d --build
  controller:
    profiles: ["apps"]
    build: .
    command: python controller.py
    env_file: .env
    environment: { DB_HOST: postgres, DB_PORT: "5432" }
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  simulator:
    profiles: ["apps"]
    build: .
    command: python simulator.py
    env_file: .env
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
